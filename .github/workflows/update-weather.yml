# Refreshes data/weather.json twice a day (about 5:15 AM and 5:15 PM India time)
# and commits it, so the hosted app always shows a fresh forecast.
name: Update weather

on:
  schedule:
    - cron: "47 23 * * *"   # 5:17 AM IST
    - cron: "47 11 * * *"   # 5:17 PM IST
  workflow_dispatch: {}      # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python weather.py
      - name: Commit if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update weather $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push
